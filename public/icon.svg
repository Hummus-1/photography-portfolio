<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <style>
    .vf-bg { fill: #0c0d0e; rx: 14px; }
    .vf-border { stroke: rgba(240, 237, 230, 0.2); stroke-width: 1px; fill: none; }
    .vf-guide { stroke: #f0ede6; opacity: 0.35; }
    .vf-reticle { stroke: #ffffff; }
    .vf-dot { fill: #e67e3a; }
    
    @media (prefers-color-scheme: light) {
      .vf-bg { fill: #151618; }
      .vf-border { stroke: rgba(255, 255, 255, 0.2); }
      .vf-guide { stroke: #faf8f5; opacity: 0.35; }
      .vf-reticle { stroke: #ffffff; }
      .vf-dot { fill: #d96b27; }
    }
  </style>

  <!-- High-contrast Background Card with Rounded Corners -->
  <rect width="64" height="64" class="vf-bg" />
  <rect width="62" height="62" x="1" y="1" rx="13" class="vf-border" />

  <g>
    <!-- Círculo Exterior Tenue / Guía de Composición (Radio 23) -->
    <circle cx="32" cy="32" r="23" stroke-width="1.2" fill="none" class="vf-guide"/>
    
    <!-- Retícula de Enfoque Principal / Ejes de Cruz -->
    <g stroke-width="2" stroke-linecap="round" class="vf-reticle">
      <line x1="32" y1="6" x2="32" y2="14" />
      <line x1="32" y1="50" x2="32" y2="58" />
      <line x1="6" y1="32" x2="14" y2="32" />
      <line x1="50" y1="32" x2="58" y2="32" />
    </g>

    <!-- Círculo Interior Continuo Punteado (Radio 12, Simétrico) -->
    <circle cx="32" cy="32" r="12" stroke-width="2" fill="none" stroke-dasharray="2.5 2.5" class="vf-reticle"/>
    
    <!-- Punto de Foco Central / Registro Rojo (Red Dot) -->
    <circle cx="32" cy="32" r="4" class="vf-dot"/>
  </g>
</svg>
